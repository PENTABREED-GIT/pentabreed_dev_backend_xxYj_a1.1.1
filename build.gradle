plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.penta'
// -> api_template.jar
//version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	/////////////////////////////////////////////////////////////////////////////////////
	// v1
	// AWS IoT Device SDK for Java
    implementation 'com.amazonaws:aws-iot-device-sdk-java:1.3.13'
    implementation 'com.amazonaws:aws-iot-device-sdk-java-samples:1.3.9'
	/////////////////////////////////////////////////////////////////////////////////////


	/////////////////////////////////////////////////////////////////////////////////////
	// v2
	// AWS IoT Device SDK for Java V2
	implementation 'software.amazon.awssdk.iotdevicesdk:aws-iot-device-sdk:1.25.0' // 여기 그룹 ID를 수정!
    implementation 'software.amazon.awssdk.crt:aws-crt:0.38.3'
    implementation 'software.amazon.awssdk:iot:2.31.45'   // 최신 버전 확인 가능
    implementation 'software.amazon.awssdk:iam:2.31.45'
    implementation 'software.amazon.awssdk:sts:2.31.45'
    implementation 'software.amazon.awssdk:sqs:2.31.45'
	/////////////////////////////////////////////////////////////////////////////////////



//    implementation 'software.amazon.awssdk.iot:aws-iot-device-sdk:1.25.0'

	// AWS IoT Device SDK for Java V1
//    implementation 'software.amazon.awssdk.iotdevicesdk:aws-iot-device-sdk:1.25.0' // 최신 버전



    // AWS CRT (Common Runtime) Java 바인딩 - V2 SDK의 기반이 됩니다.
//    implementation 'software.amazon.awssdk.crt:aws-crt:0.29.+' // 최신 버전 확인 (예: 0.29.13)


	// ① MQTT Pub/Sub용 (Device SDK + native lib)
//    implementation 'software.amazon.awssdk.iotdevicesdk:aws-iot-device-sdk:1.25.0'
//    implementation 'software.amazon.awssdk.crt:aws-crt:0.26.1'
//    implementation 'software.amazon.awssdk.crt:aws-crt:0.38.3'

    // ② IoT 리소스 관리용 (SDK v2 계열)
//    implementation 'software.amazon.awssdk:iot:2.25.5'   // 최신 버전 확인 가능
//    implementation 'software.amazon.awssdk:iam:2.25.5'
//    implementation 'software.amazon.awssdk:sts:2.25.5'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
